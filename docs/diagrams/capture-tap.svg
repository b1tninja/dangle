<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9a6b2a"/>
    </marker>
  </defs>
  <style>
    text{fill:#1f2a37}
    .t{font-size:13px}.b{font-weight:600}
    .lbl{font-size:11px;fill:#5a6672}
    .arrow{stroke:#5a6672;stroke-width:1.6;fill:none;marker-end:url(#arr)}
    .tapa{stroke:#9a6b2a;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#arrD)}
  </style>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="b" font-size="16">obd-bridge capture tap (passive observer)</text>

  <rect x="20" y="130" width="130" height="90" rx="8" fill="#eef4fa" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="85" y="170" text-anchor="middle" class="t b">TCP client</text>
  <text x="85" y="190" text-anchor="middle" class="lbl">ELM327 bytes</text>

  <rect x="200" y="80" width="250" height="200" rx="8" fill="#eaf6ec" stroke="#4a8a5a" stroke-width="1.5"/>
  <text x="325" y="104" text-anchor="middle" class="t b">bridge::run</text>
  <rect x="220" y="120" width="210" height="50" rx="6" fill="#ffffff" stroke="#4a8a5a"/>
  <text x="325" y="150" text-anchor="middle" class="t">tcp → ble pump</text>
  <rect x="220" y="195" width="210" height="50" rx="6" fill="#ffffff" stroke="#4a8a5a"/>
  <text x="325" y="225" text-anchor="middle" class="t">ble → tcp pump</text>

  <rect x="500" y="130" width="150" height="90" rx="8" fill="#eef4fa" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="575" y="165" text-anchor="middle" class="t b">BLE adapter</text>
  <text x="575" y="185" text-anchor="middle" class="lbl">write / notify</text>
  <text x="575" y="200" text-anchor="middle" class="lbl">characteristics</text>

  <path class="arrow" d="M150,145 L200,145"/>
  <path class="arrow" d="M200,205 L150,205"/>
  <path class="arrow" d="M430,145 L500,145"/>
  <path class="arrow" d="M500,205 L430,205"/>
  <text x="465" y="137" text-anchor="middle" class="lbl">write</text>
  <text x="465" y="223" text-anchor="middle" class="lbl">notify</text>

  <rect x="260" y="320" width="130" height="50" rx="8" fill="#fdf3e3" stroke="#9a6b2a" stroke-width="1.5"/>
  <text x="325" y="342" text-anchor="middle" class="t b">capture::Tap</text>
  <text x="325" y="358" text-anchor="middle" class="lbl">after delivery</text>
  <path class="tapa" d="M290,170 L290,320"/>
  <path class="tapa" d="M360,245 L360,320"/>

  <rect x="470" y="305" width="410" height="80" rx="8" fill="#fdf3e3" stroke="#9a6b2a" stroke-width="1.5"/>
  <text x="675" y="327" text-anchor="middle" class="t b">synthesized framing, one record per value</text>
  <text x="675" y="347" text-anchor="middle" class="lbl">H4 0x02 | ACL hdr | L2CAP len + CID 0x0004 | ATT 0x52 or 0x1B + handle + value</text>
  <text x="675" y="365" text-anchor="middle" class="lbl">pcap (link type 201) / btsnoop (1002) / text</text>
  <path class="tapa" d="M390,345 L470,345"/>
</svg>
