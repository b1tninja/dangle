[package]
name = "dangle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host-side adapter that bridges a Bluetooth LE serial dongle's GATT serial service to a byte stream and a TCP server"
readme = "../../README.md"
publish = false

# A library crate so sibling crates (e.g. `voltkit`) can link the host-OS BLE scan/connect API
# in-process, plus a thin binary that is the TCP bridge and the `scan` doctor CLI built on it.
[lib]
name = "dangle"
path = "src/lib.rs"

[[bin]]
name = "dangle"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Windows BLE/GATT access through Microsoft's first-party `windows` crate (WinRT projections for
# Windows.Devices.Bluetooth). No third-party BLE stack (no btleplug) and no async runtime: the WinRT
# async operations are driven synchronously with IAsyncOperation::get() on worker threads, and the
# byte pipe is plain std::net + std::thread. See docs/layout.md for why each WinRT feature is enabled.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Storage_Streams",
]
