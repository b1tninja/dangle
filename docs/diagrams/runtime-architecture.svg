<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
    <marker id="arrS" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#5a6672"/>
    </marker>
  </defs>
  <style>
    text{fill:#1f2a37}
    .t{font-size:13px}.b{font-weight:600}
    .lbl{font-size:11px;fill:#5a6672}
    .arrow{stroke:#5a6672;stroke-width:1.6;fill:none;marker-end:url(#arr)}
    .biarrow{stroke:#5a6672;stroke-width:1.6;fill:none;marker-end:url(#arr);marker-start:url(#arrS)}
  </style>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="b" font-size="16">dangle runtime topology</text>

  <!-- Client -->
  <rect x="20" y="175" width="160" height="110" rx="8" fill="#eef4fa" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="100" y="205" text-anchor="middle" class="t b">TCP client</text>
  <text x="100" y="226" text-anchor="middle" class="lbl">Android emulator /</text>
  <text x="100" y="242" text-anchor="middle" class="lbl">scan tool / app</text>
  <text x="100" y="262" text-anchor="middle" class="lbl">(Wi-Fi OBD mode)</text>
  <text x="100" y="300" text-anchor="middle" class="lbl">no host Bluetooth</text>

  <!-- TCP link -->
  <path class="biarrow" d="M185,230 L225,230"/>
  <text x="205" y="220" text-anchor="middle" class="lbl">TCP</text>

  <!-- Host container -->
  <rect x="228" y="60" width="430" height="360" rx="10" fill="#f7fafc" stroke="#9aa7b4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="443" y="84" text-anchor="middle" class="b">Host — dangle.exe</text>

  <!-- TcpListener -->
  <rect x="255" y="100" width="376" height="46" rx="8" fill="#eef4fa" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="443" y="121" text-anchor="middle" class="t b">TcpListener</text>
  <text x="443" y="137" text-anchor="middle" class="lbl">default 127.0.0.1:35000 (loopback)</text>

  <path class="arrow" d="M443,146 L443,172"/>

  <!-- bridge::run -->
  <rect x="255" y="174" width="376" height="120" rx="8" fill="#eaf6ec" stroke="#4a8a5a" stroke-width="1.5"/>
  <text x="443" y="194" text-anchor="middle" class="t b">bridge::run — thread::scope</text>
  <rect x="272" y="206" width="160" height="72" rx="6" fill="#ffffff" stroke="#4a8a5a" stroke-width="1.2"/>
  <text x="352" y="230" text-anchor="middle" class="t">tcp → ble pump</text>
  <text x="352" y="248" text-anchor="middle" class="lbl">spawned thread</text>
  <text x="352" y="266" text-anchor="middle" class="lbl">chunk to MTU</text>
  <rect x="454" y="206" width="160" height="72" rx="6" fill="#ffffff" stroke="#4a8a5a" stroke-width="1.2"/>
  <text x="534" y="230" text-anchor="middle" class="t">ble → tcp pump</text>
  <text x="534" y="248" text-anchor="middle" class="lbl">scope thread</text>
  <text x="534" y="266" text-anchor="middle" class="lbl">drain Receiver</text>

  <!-- ble module -->
  <path class="arrow" d="M352,278 L352,330"/>
  <text x="300" y="312" text-anchor="middle" class="lbl">write</text>
  <path class="arrow" d="M534,330 L534,278"/>
  <text x="578" y="312" text-anchor="middle" class="lbl">notify</text>
  <rect x="255" y="332" width="376" height="62" rx="8" fill="#eef4fa" stroke="#4a6b8a" stroke-width="1.5"/>
  <text x="443" y="356" text-anchor="middle" class="t b">ble module — WinRT GATT backend</text>
  <text x="443" y="376" text-anchor="middle" class="lbl">windows crate · Windows.Devices.Bluetooth</text>

  <!-- BLE link -->
  <path class="biarrow" d="M662,360 L706,360"/>
  <text x="684" y="350" text-anchor="middle" class="lbl">BLE</text>

  <!-- Adapter -->
  <rect x="710" y="120" width="170" height="90" rx="8" fill="#fdf1e3" stroke="#b5792e" stroke-width="1.5"/>
  <text x="795" y="150" text-anchor="middle" class="t b">BLE OBD adapter</text>
  <text x="795" y="172" text-anchor="middle" class="lbl">GATT service 0xFFF0</text>
  <text x="795" y="190" text-anchor="middle" class="lbl">write + notify chars</text>

  <!-- Adapter to vehicle -->
  <path class="biarrow" d="M795,210 L795,258"/>
  <text x="838" y="238" text-anchor="middle" class="lbl">OBD-II</text>

  <!-- Vehicle -->
  <rect x="710" y="260" width="170" height="80" rx="8" fill="#f2eefc" stroke="#6a4a9a" stroke-width="1.5"/>
  <text x="795" y="292" text-anchor="middle" class="t b">Vehicle / bench</text>
  <text x="795" y="314" text-anchor="middle" class="lbl">OBD-II bus (GMLAN)</text>

  <text x="450" y="452" text-anchor="middle" class="lbl">Transport only — raw ASCII bytes relayed both ways; no OBD/UDS parsing, no vehicle writes.</text>
</svg>
